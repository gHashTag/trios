[package]
name = "trios-mesh-node"
version = "0.1.0"
edition = "2021"
description = "Trinity GF16 CPU mesh node daemon for Railway deployment"
license = "MIT"
repository = "https://github.com/gHashTag/trios"

[[bin]]
name = "mesh-node"
path = "src/main.rs"

[dependencies]
trios-mesh = { path = "../trios-mesh", features = ["std"] }
tokio       = { workspace = true }
axum        = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow      = { workspace = true }
chrono      = { workspace = true }
sha2        = "0.10"
rand        = { workspace = true }
hex         = "0.4"
