[package]
name = "trios-chat-br-io-chat-07"
version = "0.1.0"
edition = "2021"
description = "BR-IO-CHAT-07 — async wire-emitter: tokio-driven twin of CR-CHAT-07's deterministic CoverScheduler. Drives Real/Cover emissions onto an async channel."
publish = false

# Anchor: phi^2 + phi^-2 = 3 · TRINITY · CHAT · ZERO-METADATA · UNLINKABLE
# Bronze-tier I/O ring — wraps the pure CR-CHAT-07 scheduler logic
# with a deterministic async tick driver. Tests use tokio::time::pause
# + advance to keep the emission stream byte-reproducible.

[dependencies]
trios-chat-cr-chat-00 = { path = "../CR-CHAT-00" }
trios-chat-cr-chat-07 = { path = "../CR-CHAT-07" }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "test-util"] }
