[package]
name = "trios-chat-cr-chat-06"
version = "0.1.0"
edition = "2021"
description = "CR-CHAT-06 — capability + injection: signed capability tokens (R-CHAT-6/8) + dual-LLM prompt-injection filter (R-CHAT-7) for Trinity Secure Chat"
publish = false

# Anchor: phi^2 + phi^-2 = 3 · TRINITY · CHAT · ZERO-METADATA
# Silver-tier (Core) ring — pure logic + serde + Ed25519.
# No async, no I/O, no DB.

[dependencies]
trios-chat-cr-chat-00 = { path = "../CR-CHAT-00" }
serde             = { workspace = true }
serde_json        = { workspace = true }
thiserror         = { workspace = true }
ed25519-dalek     = { version = "2", features = ["rand_core"] }
sha2              = "0.10"
rand_core         = { version = "0.6", features = ["getrandom"] }
