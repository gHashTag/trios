[package]
name = "trios-a2a-sr04"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "SR-04 — durable persistence for the A2A registry (SeaORM/SQLite: cards, tasks, wire state)"
publish = false

[dependencies]
trios-a2a-sr00 = { path = "../SR-00" }
trios-a2a-sr01 = { path = "../SR-01" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
anyhow = "1"
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
