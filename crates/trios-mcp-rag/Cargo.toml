[package]
name = "trios-mcp-rag"
version = "0.1.0"
edition = "2021"
description = "MCP server: RAG over Railway PostgreSQL SSOT (golden-bridge chapters)"

[[bin]]
name = "trios-mcp-rag"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio-postgres = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
