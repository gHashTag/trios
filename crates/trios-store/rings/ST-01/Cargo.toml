[package]
name = "trios-store-st01"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ST-01 — SQLite repository (SeaORM) over ST-00 rows"
publish = false

[dependencies]
trios-store-st00 = { path = "../ST-00" }
serde = { workspace = true }
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "runtime-tokio", "macros"] }
anyhow = "1"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
