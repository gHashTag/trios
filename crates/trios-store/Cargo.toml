[package]
name = "trios-store"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "TRIOS Store — unified persistence (SQLite/SeaORM) for the consolidated Rust backend (Ring Isolation)"
publish = false

[workspace]
members = [
    "rings/ST-00",
    "rings/ST-01",
    "rings/ST-02",
    "rings/BR-OUTPUT",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Dmitrii Vasilev"]
license = "MIT"
repository = "https://github.com/gHashTag/trios"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
trios-store-st00 = { path = "rings/ST-00" }
trios-store-st01 = { path = "rings/ST-01" }
trios-store-st02 = { path = "rings/ST-02" }
trios-store-br-output = { path = "rings/BR-OUTPUT" }
