[package]
name = "trios-host-cdp"
version = "0.1.0"
edition = "2021"
description = "Host CDP agent: polls the trios-server SR-03 browser-command queue and drives Chrome over raw CDP (rings HC-00..02)"

[dependencies]
trios-host-cdp-hc00 = { path = "rings/HC-00" }
trios-host-cdp-hc01 = { path = "rings/HC-01" }
trios-host-cdp-hc02 = { path = "rings/HC-02" }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[[bin]]
name = "trios-host-cdp"
path = "src/main.rs"
