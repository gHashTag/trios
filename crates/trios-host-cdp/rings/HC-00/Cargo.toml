[package]
name = "trios-host-cdp-hc00"
version = "0.1.0"
edition = "2021"
description = "HC-00: minimal raw-WebSocket CDP client (id-correlated calls, event skipping, target discovery)"

[dependencies]
anyhow = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[dev-dependencies]
axum = { workspace = true }
