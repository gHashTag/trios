# PhD-style atlas preset for the Vasilev-Pellis Constants article.
#
# Consumed by `tri article presets` and `tri article build ... --pdf|--html`.
# Defines the house style. Renderer must produce real PDF text (no AI
# rasterization), placed near each referencing section.
#
# Visible header (running text on every page of the PDF and HTML) is
# defined by [render.header] in article.toml and is:
#   left   = "Vasilev-Pellis Constants"
#   right  = "Trinity S³AI DNA"
# Pre-v21.6 header strings are obsolete; the exhaustive list lives in
# qa/pellis-trinity-full.qa.toml::forbidden_phrases.

[preset]
name        = "phdstyle-atlas"
description = "PhD-style atlas / codex / triptych house style for the Vasilev-Pellis Constants article (under the Trinity S³AI DNA brand)."

[page]
size      = "A4"
margin_mm = 24

# v22.10 final-style audit lock: pure white #FFFFFF page background,
# black #000000 text, B&W Da Vinci / scientific atlas / PhD triptych
# style. No teal / colored service pages, no cream / off-white
# backgrounds. The verify-style gate (see _runner/src/main.mjs)
# enforces this on every PDF build.
[colors]
background     = "#FFFFFF"   # PURE WHITE (locked, was cream #F7F6F2 pre-v22.10)
text           = "#000000"   # PURE BLACK
muted          = "#555555"   # mid-grey for header/footer/captions
primary        = "#000000"   # headings stay B&W (was teal #01696F pre-v22.10)
border         = "#B0B0B0"   # mid-grey rule lines
blockquote_bg  = "#F2F2F2"   # neutral light grey for blockquote panel
th_bg          = "#EDEDED"   # neutral light grey for table header

# Code-block styling. Both inline `code` and fenced ```code``` use an
# opaque, light-neutral background so dark body text remains readable
# (WCAG-AA contrast against the panel, > 12:1 in practice). v22.10
# locks these to neutral greys (was warm cream pre-v22.10) to keep
# the cream-corner audit green.
code_bg        = "#F2F2F2"   # fenced-block panel background, opaque grey
code_inline_bg = "#EFEFEF"   # inline-code chip background, opaque grey
code_text      = "#000000"   # mono text color (same as body text)
code_border    = "#B0B0B0"   # fenced-block panel border

[fonts]
body_family   = "Inter, Helvetica, sans-serif"
mono_family   = "JetBrains Mono, Menlo, monospace"
body_size_pt  = 10.8
label_min_pt  = 8.0
heading1_pt   = 23.0
heading2_pt   = 14.0

[rules]
no_pseudo_latin                 = true
no_rasterized_text_in_figures   = true
no_microtext_below_7pt          = true
labels_must_be_pdf_text         = true
figures_placed_near_section     = true
fail_build_on_qa_regression     = true
# v22.10 style-gate invariants:
require_pure_white_background   = true   # PDF pages must be #FFFFFF; gated by color-page audit
forbid_cream_corner             = true   # gated by cream-corner audit (no #F7F6F2-ish corners)
forbid_colored_service_pages    = true   # heading color stays B&W; gated by color-page audit
forbid_duplicate_image_hashes   = true   # gated by pdfimages-hash audit
forbid_orange_annotations       = true   # gated by annotation-color audit

[annotations]
# Only link annotations are permitted in the final PDF.
# Highlight / comment / text-markup annotations are forbidden.
allow_link_annots      = true
allow_highlight_annots = false
allow_text_markup      = false
allow_comments         = false
allow_popup            = false
expected_annots_when_no_links = 0
