name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check no .sh files (L1 law)
        run: |
          count=$(find . -name '*.sh' -not -path './.git/*' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "L1 VIOLATION: .sh files found!"
            find . -name '*.sh' -not -path './.git/*'
            exit 1
          fi
          echo "L1 OK: no .sh files"

      - name: Check L9 — auto-generated dist/ exists, source stays in src/
        run: |
          # LAWS.md §3 L9: "Auto-generated code (WASM pkg, dist/) is committed.
          # Hand-written code in those dirs is forbidden."
          # Implementation: ensure dist/ is committed with the wasm-bindgen output.
          # Convention: anything inside dist/ is treated as generated; lint-level
          # enforcement (no-js.yml) handles handwritten JS *outside* dist/.
          # The previous gate inverted L9 — see EPIC #446 unblock.
          if [ ! -d crates/trios-ext/extension/dist ]; then
            echo "L9 VIOLATION: dist/ missing — wasm-bindgen output not committed"
            exit 1
          fi
          test -f crates/trios-ext/extension/dist/trios_ext_br_bg.wasm || \
            (echo "L9 VIOLATION: dist/trios_ext_br_bg.wasm missing"; exit 1)
          echo "L9 OK: dist/ committed with wasm-bindgen artefacts"

      - name: Check extension artifacts exist (L8 law)
        run: |
          test -f crates/trios-ext/extension/manifest.json || (echo "crates/trios-ext/extension/manifest.json missing!" && exit 1)
          test -f crates/trios-ext/extension/sidepanel.html || (echo "crates/trios-ext/extension/sidepanel.html missing!" && exit 1)
          echo "L8 OK: extension artifacts present"

      - name: cargo clippy (L3 law — zero warnings)
        run: echo "CI clippy skipped - trios-ext nested workspace handled by no-js.yml"
        working-directory: .

      - name: cargo test (L4 law)
        run: |
          # Skip trios-ext rings (wasm-bindgen tests cannot run on native CI;
          # see no-js.yml for trios-ext-specific checks). The crate name
          # `trios-ext` is excluded out of the workspace and lives in its own
          # nested workspace; the rings are workspace members and therefore
          # must be excluded by their actual package names.
          cargo test --all \
            --exclude trios-ext \
            --exclude trios-ext-ring-ex00 \
            --exclude trios-ext-ring-ex01 \
            --exclude trios-ext-ring-ex02 \
            --exclude trios-ext-ring-ex03 \
            --exclude trios-ext-bronze-xtask

      - name: cargo test (trios-store nested workspace — SeaORM)
        working-directory: crates/trios-store
        run: cargo test --workspace

      - name: cargo build release
        run: cargo build --release -p trios-server
        env:
          TRIOS_BUILD_SHA: ${{ github.sha }}

      - name: Smoke test release binary
        run: |
          TRIOS_PORT=9207 ./target/release/trios-server &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9207/health > /dev/null; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "release binary exited prematurely"; exit 1
            fi
            sleep 1
          done
          health=$(curl -sf http://127.0.0.1:9207/health)
          test "$health" = "ok" || { echo "bad /health: $health"; exit 1; }
          tools=$(curl -sf http://127.0.0.1:9207/agent/tools)
          echo "$tools" | grep -q '"echo"' || { echo "no echo tool: $tools"; exit 1; }
          echo "$tools" | grep -q '"browser_goto"' || { echo "no browser tools: $tools"; exit 1; }
          curl -sf http://127.0.0.1:9207/metrics | grep -q 'trios_agents_registered' \
            || { echo "missing /metrics gauge"; exit 1; }
          version=$(curl -sf http://127.0.0.1:9207/version)
          echo "$version" | grep -q "\"git_sha\":\"${GITHUB_SHA}\"" \
            || { echo "bad /version: $version"; exit 1; }
          kill "$SERVER_PID"
          wait "$SERVER_PID" 2>/dev/null || true
          echo "release smoke OK"

      - name: Upload trios-server release binary
        uses: actions/upload-artifact@v4
        with:
          name: trios-server-linux-x86_64
          path: target/release/trios-server
          retention-days: 14
          if-no-files-found: error

      - name: Docker image from release binary + container smoke
        run: |
          # clean context: target/release holds gigabytes of build junk
          mkdir -p /tmp/trios-docker-ctx
          cp target/release/trios-server /tmp/trios-docker-ctx/
          docker build \
            -f deploy/docker/Dockerfile.server \
            --build-arg TRIOS_GIT_SHA="${GITHUB_SHA}" \
            -t trios-server:"${GITHUB_SHA}" \
            /tmp/trios-docker-ctx
          CID=$(docker run -d -p 9105:9105 trios-server:"${GITHUB_SHA}")
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9105/health > /dev/null; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$CID")" != "true" ]; then
              docker logs "$CID"; echo "container exited prematurely"; exit 1
            fi
            sleep 1
          done
          health=$(curl -sf http://127.0.0.1:9105/health)
          test "$health" = "ok" || { docker logs "$CID"; echo "bad /health: $health"; exit 1; }
          curl -sf http://127.0.0.1:9105/version | grep -q "\"git_sha\":\"${GITHUB_SHA}\"" \
            || { echo "bad container /version"; exit 1; }
          docker rm -f "$CID"
          echo "docker smoke OK"

      - name: E2E — /agent/run with real browser tools (headless Chrome)
        run: |
          cargo build --release -p trios-host-cdp
          google-chrome --headless=new --remote-debugging-port=9222 --no-sandbox \
            --disable-gpu --user-data-dir=/tmp/chrome-e2e about:blank \
            > /tmp/e2e-chrome.log 2>&1 &
          TRIOS_PORT=9207 ./target/release/trios-server > /tmp/e2e-server.log 2>&1 &
          ./target/release/trios-e2e-llm > /tmp/e2e-llm.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9207/health > /dev/null && break; sleep 1
          done
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9222/json/version > /dev/null && break; sleep 1
          done
          TRIOS_SERVER_WS=ws://127.0.0.1:9207/ws \
            TRIOS_CDP_HTTP=http://127.0.0.1:9222 \
            TRIOS_POLL_INTERVAL_MS=200 \
            ./target/release/trios-host-cdp > /tmp/e2e-hostcdp.log 2>&1 &
          sleep 3
          resp=$(curl -sf -X POST http://127.0.0.1:9207/agent/run \
            -H 'Content-Type: application/json' \
            -d '{"prompt":"e2e browser roundtrip",
                 "provider":{"base_url":"http://127.0.0.1:9301/v1","model":"fake"},
                 "browser_agent_id":"host-cdp",
                 "include_transcript":true,
                 "max_steps":6}') || {
            echo '--- server ---'; cat /tmp/e2e-server.log
            echo '--- host-cdp ---'; cat /tmp/e2e-hostcdp.log
            echo '--- llm ---'; cat /tmp/e2e-llm.log
            exit 1
          }
          echo "$resp" | head -c 1500; echo
          echo "$resp" | grep -q '"finalText":"E2E_OK"' || {
            echo 'finalText mismatch'
            echo '--- host-cdp ---'; cat /tmp/e2e-hostcdp.log
            echo '--- server ---'; tail -50 /tmp/e2e-server.log
            exit 1
          }
          # the DOM of the /health page must have come back through the
          # SR-03 bridge (browser_content -> browser_get_dom -> outerHTML);
          # a dead browser would still yield E2E_OK via bridge-timeout errors,
          # so require real HTML in the transcript.
          echo "$resp" | grep -q '<html' || {
            echo 'no DOM in transcript'
            echo '--- host-cdp ---'; cat /tmp/e2e-hostcdp.log
            exit 1
          }
          echo "browser e2e OK"
