name: PhD monograph — Flos Aureus (R1 Rust-only build/audit)

on:
  push:
    paths:
      - "docs/phd/**"
      - "crates/trios-phd/**"
      - ".github/workflows/phd-build.yml"
  pull_request:
    paths:
      - "docs/phd/**"
      - "crates/trios-phd/**"
      - ".github/workflows/phd-build.yml"
  workflow_dispatch:

# R1 — Rust-only. No `.py`, no `.sh`. Every PhD operation goes through the
# `trios-phd` Rust binary.

permissions:
  contents: read

jobs:
  audit:
    name: Audit · Biblio · Coq-map · Reproduce
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-trios-phd-${{ hashFiles('**/Cargo.lock') }}

      - name: Build trios-phd
        run: cargo build -p trios-phd --locked

      - name: Unit tests
        run: cargo test -p trios-phd --locked

      - name: Clippy
        run: cargo clippy -p trios-phd --locked -- -D warnings

      - name: Audit (R3 / R11 / R14 floors)
        run: cargo run -q -p trios-phd -- --phd-root docs/phd audit

      - name: Bibliography (R11 ≥150)
        run: cargo run -q -p trios-phd -- --phd-root docs/phd biblio

      - name: Coq citation map (R14)
        run: cargo run -q -p trios-phd -- --phd-root docs/phd coq-map --check

      - name: Reproducibility manifest
        run: cargo run -q -p trios-phd -- --phd-root docs/phd reproduce

      - name: Job summary
        if: always()
        run: |
          echo "## PhD build · audit summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Anchor: \`phi^2 + phi^-2 = 3\` · Zenodo DOI 10.5281/zenodo.19227877" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Rules enforced: R1 (Rust-only), R3 (chapter floor), R11 (bib ≥150), R14 (Coq table)." >> "$GITHUB_STEP_SUMMARY"

  compile:
    name: Compile · tectonic (EN+RU)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: audit
    # PhD v6: tectonic gate is now a soft-fail uploader — main.pdf and main_ru.pdf
    # are published as artifacts even if compile-resilient quarantines stragglers.
    # The Rust binary is the single entry point (R1).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tectonic
        run: |
          curl -fsSL https://drop-sh.fullyjustified.net | sh -s -- --version 0.15.0
          sudo mv tectonic /usr/local/bin/tectonic

      - name: Install pandoc (build-book phase 2)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends pandoc

      - name: Compile main.tex (EN) via trios-phd compile-resilient
        id: build_en
        continue-on-error: true
        run: cargo run -q -p trios-phd -- --phd-root docs/phd compile-resilient --max-rounds 80

      - name: Compile main_ru.tex (RU)
        id: build_ru
        continue-on-error: true
        run: |
          cd docs/phd
          tectonic -X compile main_ru.tex --keep-intermediates --keep-logs || true

      - name: Upload EN PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flos-aureus-en-pdf
          path: docs/phd/main.pdf
          if-no-files-found: warn

      - name: Upload RU PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flos-aureus-ru-pdf
          path: docs/phd/main_ru.pdf
          if-no-files-found: warn

      - name: Upload quarantine snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phd-quarantine
          path: docs/phd/quarantine/
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          echo "## PhD compile · EN+RU artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f docs/phd/main.pdf ]; then
            EN_PAGES=$(strings docs/phd/main.pdf | grep -m1 "^/Count" | awk '{print $2}' || echo unknown)
            EN_SIZE=$(stat -c%s docs/phd/main.pdf)
            echo "- EN main.pdf: ${EN_SIZE} bytes" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- EN main.pdf: MISSING" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f docs/phd/main_ru.pdf ]; then
            RU_SIZE=$(stat -c%s docs/phd/main_ru.pdf)
            echo "- RU main_ru.pdf: ${RU_SIZE} bytes" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- RU main_ru.pdf: MISSING" >> "$GITHUB_STEP_SUMMARY"
          fi
          QC=$(ls docs/phd/quarantine/ 2>/dev/null | wc -l || echo 0)
          echo "- Quarantined chapters: ${QC}" >> "$GITHUB_STEP_SUMMARY"
