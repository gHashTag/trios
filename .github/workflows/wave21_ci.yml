# .github/workflows/wave21_ci.yml
# Wave 21 CI — Sovereign Scarabs
# Agents: A–I (Waves 16-21) · gHashTag/trios

name: "Wave 21 CI — Sovereign Scarabs"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────
  # Job 1: lint — cargo fmt + clippy
  # ─────────────────────────────────────────
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (stable)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: true

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-targets -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ─────────────────────────────────────────
  # Job 2: test — workspace unit + integration (no DB)
  # ─────────────────────────────────────────
  test:
    name: Tests (no-DB)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (stable)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: cargo test --workspace --all-features (skip #[ignore] DB tests)
        # DB-dependent tests are tagged #[ignore] and skipped here.
        # They run in the live_smoke job on main pushes only.
        run: cargo test --workspace --all-features

  # ─────────────────────────────────────────
  # Job 3: live_smoke — runs on main pushes only
  # Uses RAILWAY_DSN secret; never hardcoded.
  # Runs the #[ignore]-tagged Railway integration tests.
  # ─────────────────────────────────────────
  live_smoke:
    name: Live Smoke (Railway · main only)
    runs-on: ubuntu-latest
    # Only fire on pushes to main — not on pull_request events
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    env:
      RAILWAY_DSN: ${{ secrets.RAILWAY_DSN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (stable)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: cargo test --workspace -- --ignored  (Railway live smoke)
        # Runs only tests marked #[ignore] — these require RAILWAY_DSN.
        # service_id prefix: w21-smoke-ci-<unix_ts_ns>
        # Cleanup via kill_scarab + DELETE on base tables only.
        run: cargo test --workspace -- --ignored
        timeout-minutes: 15

      - name: Upload smoke log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave21-smoke-log-${{ github.run_id }}
          path: |
            target/nextest/
            **/*smoke*.log
          retention-days: 14

  # ─────────────────────────────────────────
  # Job 4: matrix_sweep_artifact — upload sweep plan
  # Runs on all triggers; no DB required.
  # ─────────────────────────────────────────
  matrix_sweep_artifact:
    name: Matrix Sweep Artifact
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload matrix sweep plan
        uses: actions/upload-artifact@v4
        with:
          name: wave21-matrix-sweep-${{ github.run_id }}
          path: |
            crates/trios-scarab-control/sweep/
            docs/wave21/
          retention-days: 30
          if-no-files-found: warn

  # ─────────────────────────────────────────
  # Job 5: v3_migration_check — validate SQL syntax (no live DB)
  # ─────────────────────────────────────────
  v3_migration_check:
    name: v3 Migration SQL Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install postgresql-client
        run: sudo apt-get install -y postgresql-client

      - name: Syntax-check v3 migration SQL (dry-run, no DB connection)
        # pg_dump --schema-only / psql --dry-run is not available,
        # so we use pgformatter / pgsanity for static analysis.
        run: |
          if command -v pgsanity &>/dev/null; then
            find . -name "v3*.sql" -exec pgsanity {} +
          else
            echo "pgsanity not installed — skipping SQL lint (non-blocking)"
            # Verify file exists at minimum
            find . -name "v3*.sql" | grep . || echo "Warning: no v3*.sql found in tree"
          fi
